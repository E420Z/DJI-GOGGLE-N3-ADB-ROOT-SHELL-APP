name: ci

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: py -3.12 -m pip install -r requirements.txt
      - name: Compile
        run: py -3.12 -m compileall -q app tests
      - name: Smoke test
        run: py -3.12 tests/smoke.py
